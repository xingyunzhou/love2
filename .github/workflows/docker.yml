name: Build and push image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}
  # secrets 不能出现在 if: 里（if 条件不提供 secrets 上下文，会报
  # Unrecognized named-value: 'secrets'），先落到 env 再用 env.X != '' 判断
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  smoke:
    name: 语法与端到端冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 工作流自身静态检查（secrets-in-if / 空 images）
        run: python tests/check_workflow.py
      - name: 前端静态检查（主题变量 / 设置控件 / 文案）
        run: python tests/check_frontend.py
      - name: 编译检查
        run: python -m compileall -q backend
      - name: 号池换号逻辑冒烟（假上游）
        run: python tests/run_smoke.py

  build:
    name: 构建并推送镜像
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（配了 secrets 才跑）
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 GHCR 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Docker Hub 单独一步：images 里塞条件表达式会拼出空条目导致 metadata-action 失败，
      # 这里直接给固定 tag 列表，命中 gha 缓存，实际不重编
      - name: 构建并推送 Docker Hub（可选）
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USER != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USER }}/endpoint-pool:latest
            docker.io/${{ env.DOCKERHUB_USER }}/endpoint-pool:${{ github.sha }}
          cache-from: type=gha
          provenance: false
